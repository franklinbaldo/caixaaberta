[project]
name = "real-estate-data-pipeline"
version = "0.1.0"
description = "Consolida os imóveis à venda da Caixa em um Parquet e publica no Internet Archive."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "internetarchive>=3.3.0",
    "pyarrow",
    "requests>=2.25.0",
    "lxml>=4.6.0",
    "geopy>=2.2.0",
    "python-dotenv>=0.15.0",
    "ibis-framework[duckdb]",
    "html5lib",
    "beautifulsoup4"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "requests-mock>=1.9.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "*.md", "pyproject.toml", ".env.sample"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
minversion = "6.0"
addopts = "-ra -q"
