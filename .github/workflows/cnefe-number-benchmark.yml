name: CNEFE number benchmark

on:
  pull_request:
    paths:
      - scripts/benchmark_cnefe_numero.py
      - .github/workflows/cnefe-number-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Measure number-level CNEFE gain
        run: uv run scripts/benchmark_cnefe_numero.py --output cnefe-number-benchmark.json

      - name: Publish result as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnefe-number-benchmark
          path: cnefe-number-benchmark.json
          retention-days: 30
          if-no-files-found: warn
