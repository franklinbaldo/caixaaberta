name: Real Estate Data Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" venv .venv --python "$(which python)"
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python '.[dev]'

      - name: Run Pytest tests
        run: .venv/bin/python -m pytest -v tests/

      - name: Validar o bundle OKF
        run: |
          "$HOME/.local/bin/uvx" --from okf-parser==0.45.2 okf-parser check knowledge --require-spec 'types/{slug}.md' --normative-spec

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" venv .venv --python "$(which python)"
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python '.[dev]'

      - name: Process Parquet and publish to Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GEOCODER_KEY: ${{ secrets.GEOCODER_KEY }}
        run: .venv/bin/python src/run_pipeline.py

      - name: Upload generated Parquet as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imoveis-caixa-parquet
          path: output_data/*.parquet
          retention-days: 7
          if-no-files-found: warn

      - name: Generate report
        if: always()
        run: .venv/bin/python src/reporter.py
