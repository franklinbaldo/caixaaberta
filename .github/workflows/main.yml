name: Real Estate Data Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_fetch:
        description: >-
          Baixar a lista da Caixa antes de publicar. Desligado por padrão: o
          anti-bot da Caixa bloqueia a maior parte das requisições e o
          pipeline exige as 27 UFs. Ligue para medir a taxa de sucesso a
          partir do runner.
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" venv .venv --python "$(which python)"
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python '.[dev]'

      - name: Run Pytest tests
        run: .venv/bin/python -m pytest -v tests/

      - name: Conferir bundle contra o código
        run: |
          "$HOME/.local/bin/uv" run scripts/check_bundle_contract.py

      - name: Validar o bundle OKF
        run: |
          "$HOME/.local/bin/uvx" --from okf-parser==0.45.2 okf-parser check knowledge --require-spec 'types/{slug}.md' --normative-spec

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" venv .venv --python "$(which python)"
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python '.[dev]'

      - name: Process Parquet and publish to Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          RUN_FETCH: ${{ inputs.run_fetch || false }}
        run: |
          if [ "$RUN_FETCH" = "true" ]; then
            .venv/bin/python src/run_pipeline.py
          else
            .venv/bin/python src/run_pipeline.py --skip-fetch
          fi

      - name: Upload generated Parquet as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imoveis-caixa-parquet
          path: output_data/*.parquet
          retention-days: 7
          if-no-files-found: warn

      - name: Generate report
        if: always()
        run: .venv/bin/python src/reporter.py
